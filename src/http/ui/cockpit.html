<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockpit OS</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
:root {
  --bg: #0b0e14;
  --cyan: #00d4ff;
  --surface: #111620;
  --border: #1e2a3a;
  --text: #c8d6e5;
  --text-dim: #6b7d95;
  --green: #2ecc71;
  --yellow: #f1c40f;
  --red: #e74c3c;
  --blue: #3498db;
  --orange: #e67e22;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--cyan);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo svg { width: 28px; height: 28px; fill: var(--cyan); }
.token-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 420px;
}
.token-group input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  outline: none;
  min-width: 160px;
}
.token-group input:focus { border-color: var(--cyan); }
.token-group input::placeholder { color: var(--text-dim); }
.btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  white-space: nowrap;
  transition: all 0.15s;
}
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn.primary { background: var(--cyan); color: var(--bg); border-color: var(--cyan); font-weight: 600; }
.btn.primary:hover { opacity: 0.85; }
.header-actions { display: flex; gap: 8px; margin-left: auto; }

/* STATUS BAR */
.status-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 11px;
  color: var(--text-dim);
  flex-wrap: wrap;
}
.pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
  flex-shrink: 0;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(46,204,113,0.6); }
  50% { box-shadow: 0 0 0 6px rgba(46,204,113,0); }
}
.countdown { color: var(--cyan); font-weight: 600; }
.status-item { display: flex; align-items: center; gap: 6px; }

/* MAIN GRID */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: 16px;
  padding: 16px 20px 24px;
}
/* Make IG status span full right column in a specific layout */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.panel-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 13px;
  color: var(--cyan);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.panel-header .count {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 400;
}
.panel-body { padding: 12px 16px; }

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(30,42,58,0.5);
  vertical-align: middle;
}
tr:hover td { background: rgba(0,212,255,0.03); }
tr:last-child td { border-bottom: none; }

/* STATUS PILLS */
.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.pill.queued { background: rgba(241,196,15,0.15); color: var(--yellow); }
.pill.running { background: rgba(52,152,219,0.15); color: var(--blue); }
.pill.done, .pill.posted { background: rgba(46,204,113,0.15); color: var(--green); }
.pill.failed { background: rgba(231,76,60,0.15); color: var(--red); }
.pill.draft { background: rgba(107,125,149,0.15); color: var(--text-dim); }
.pill.ready { background: rgba(0,212,255,0.15); color: var(--cyan); }
.pill.active { background: rgba(0,212,255,0.15); color: var(--cyan); }
.pill.overdue { background: rgba(231,76,60,0.15); color: var(--red); }

/* EMAIL CARDS */
.email-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.email-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px;
}
.email-card .email-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.email-from {
  font-weight: 600;
  color: var(--text);
  font-size: 12px;
}
.email-subject {
  color: var(--cyan);
  font-size: 12px;
  margin-bottom: 4px;
}
.email-preview {
  color: var(--text-dim);
  font-size: 11px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.4;
}
.priority-badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}
.priority-badge.high { background: rgba(231,76,60,0.2); color: var(--red); }
.priority-badge.medium { background: rgba(241,196,15,0.2); color: var(--yellow); }
.priority-badge.low { background: rgba(46,204,113,0.2); color: var(--green); }

/* TASKS */
.task-group { margin-bottom: 14px; }
.task-group:last-child { margin-bottom: 0; }
.task-group-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.task-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  font-size: 12px;
}
.task-item input[type="checkbox"] {
  accent-color: var(--cyan);
  width: 15px;
  height: 15px;
  cursor: pointer;
  flex-shrink: 0;
}
.task-label { flex: 1; min-width: 0; }
.task-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.task-due {
  font-size: 10px;
  color: var(--text-dim);
  white-space: nowrap;
}
.pill-sm {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
}

/* IG STATUS */
.ig-status-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.ig-stat-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: 4px;
  border: 1px solid var(--border);
}
.ig-stat-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(0,212,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ig-stat-icon svg { width: 20px; height: 20px; fill: var(--cyan); }
.ig-stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--cyan);
}
.ig-stat-label {
  font-size: 11px;
  color: var(--text-dim);
}
.ig-progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.ig-progress-fill {
  height: 100%;
  background: var(--cyan);
  border-radius: 2px;
  transition: width 0.5s;
}
.ig-target-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(0,212,255,0.08);
  border-radius: 4px;
  font-size: 12px;
  color: var(--cyan);
  font-weight: 600;
}
.ig-compass svg {
  width: 24px;
  height: 24px;
  fill: var(--cyan);
}

/* LOADING / EMPTY */
.loading, .empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-dim);
  font-size: 12px;
}
.loading::after {
  content: '...';
  animation: dots 1.5s infinite;
}
@keyframes dots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}
.error-state {
  text-align: center;
  padding: 24px 16px;
  color: var(--red);
  font-size: 12px;
}

/* SCROLLABLE BODIES */
.scroll-y {
  max-height: 420px;
  overflow-y: auto;
}
.scroll-y::-webkit-scrollbar { width: 5px; }
.scroll-y::-webkit-scrollbar-track { background: transparent; }
.scroll-y::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* JOB ID MONOSPACE */
.mono { font-family: inherit; color: var(--text-dim); font-size: 11px; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .main-grid {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 10px 10px 20px;
  }
  .header {
    padding: 10px 12px;
    gap: 10px;
  }
  .token-group { max-width: 100%; }
  .header-actions { margin-left: 0; }
  table { font-size: 11px; }
  th, td { padding: 5px 6px; }
  .scroll-y { max-height: 220px; }
  .panel-header { padding: 8px 10px; font-size: 12px; }
  .panel-body { padding: 6px 10px; }
}
@media (max-width: 500px) {
  .logo { font-size: 16px; }
  .header { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px; }
  .token-group { max-width: 100%; flex: none; }
  .token-group input { min-width: 0; font-size: 14px; padding: 10px 12px; }
  .header-actions { margin-left: 0; justify-content: flex-end; }
  .btn { padding: 8px 14px; font-size: 13px; }
  .status-bar { gap: 8px; padding: 6px 12px; font-size: 12px; }
  .main-grid { padding: 10px; gap: 10px; }
  .panel-body { padding: 6px 10px; overflow-x: auto; }
  table { font-size: 12px; display: block; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
  th, td { padding: 6px 8px; }
  .scroll-y { max-height: 180px; }
  body { font-size: 14px; }
  .panel-header { padding: 8px 10px; font-size: 13px; }
}

/* Calendar detail expansion */
.calendar-detail td { padding: 0; border-bottom: 1px solid var(--border); }
.detail-card {
  background: var(--bg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.detail-caption { color: var(--text); font-size: 13px; line-height: 1.6; white-space: normal; }
.detail-meta { color: var(--text-dim); font-size: 12px; }
.detail-meta a { color: var(--cyan); text-decoration: underline; }
.detail-actions { display: flex; gap: 8px; margin-top: 4px; }
tr.expanded td { background: rgba(0,212,255,0.05); }

</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    COCKPIT OS
  </div>
  <div class="token-group">
    <input type="password" id="tokenInput" placeholder="Enter API token..." />
    <button class="btn" onclick="saveToken()">SAVE</button>
    <button class="btn" onclick="clearToken()" title="Clear saved token">✕</button>
  </div>
  <div class="header-actions">
    <button class="btn primary" onclick="refreshAll()">⟳ REFRESH</button>
  </div>
</header>

<!-- STATUS BAR -->
<div class="status-bar">
  <div class="status-item"><span class="pulse-dot"></span> LIVE</div>
  <div class="status-item">Last refresh: <strong id="lastRefresh">--</strong></div>
  <div class="status-item">Next in: <span class="countdown" id="countdown">60s</span></div>
</div>

<!-- MAIN GRID -->
<div class="main-grid">

  <!-- JOBS QUEUE (top-left) -->
  <div class="panel">
    <div class="panel-header">📋 JOBS QUEUE <span class="count" id="jobsCount"></span></div>
    <div class="panel-body scroll-y" id="jobsBody">
      <div class="loading">Loading jobs</div>
    </div>
  </div>

  <!-- EMAIL TRIAGE (top-right) -->
  <div class="panel">
    <div class="panel-header">✉ EMAIL TRIAGE <span class="count" id="emailCount"></span></div>
    <div class="panel-body scroll-y" id="emailBody">
      <div class="loading">Loading emails</div>
    </div>
  </div>

  <!-- DAILY TASKS (middle-left) -->
  <div class="panel" style="grid-row: span 1;">
    <div class="panel-header">✓ DAILY TASKS <span class="count" id="tasksCount"></span></div>
    <div class="panel-body scroll-y" id="tasksBody">
      <div class="loading">Loading tasks</div>
    </div>
  </div>

  <!-- CONTENT CALENDAR (middle-right) -->
  <div class="panel" style="grid-row: span 1;">
    <div class="panel-header">📅 CONTENT CALENDAR <span class="count" id="calendarCount"></span></div>
    <div class="panel-body scroll-y" id="calendarBody">
      <div class="loading">Loading calendar</div>
    </div>
  </div>

  <!-- IG STATUS (bottom-right, spans) -->
  <div class="panel" style="grid-column: 2; grid-row: span 1;">
    <div class="panel-header">📸 IG STATUS</div>
    <div class="panel-body" id="igStatusBody">
      <div class="loading">Loading IG stats</div>
    </div>
  </div>

</div>

<script>
const API_BASE = 'https://cockpit-os-646650189890.us-central1.run.app';
const TOKEN_KEY = 'cockpit_token';
let countdownTimer = null;
let refreshInterval = null;

// --- TOKEN MANAGEMENT ---
function getToken() {
  return localStorage.getItem(TOKEN_KEY) || '';
}

function saveToken() {
  const val = document.getElementById('tokenInput').value.trim();
  if (val) {
    localStorage.setItem(TOKEN_KEY, val);
    document.getElementById('tokenInput').value = '';
    refreshAll();
  }
}

function clearToken() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('tokenInput').value = '';
  renderAllEmpty('Token not set');
}

// --- API HELPERS ---
async function apiFetch(path) {
  const token = getToken();
  const headers = { 'Accept': 'application/json' };
  if (token) {
    headers['Authorization'] = 'Bearer ' + token;
  }
  const res = await fetch(API_BASE + path, { headers });
  if (!res.ok) {
    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
  }
  return res.json();
}

function safeApiFetch(path) {
  return apiFetch(path).catch(err => {
    console.error('API error:', path, err);
    return null;
  });
}

// --- TIMESTAMP HELPER ---
function timeAgo(iso) {
  if (!iso) return '--';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDate(iso) {
  if (!iso) return '--';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// --- RENDER: JOBS ---
function renderJobs(data) {
  const body = document.getElementById('jobsBody');
  const count = document.getElementById('jobsCount');
  if (!data || !Array.isArray(data)) {
    body.innerHTML = '<div class="error-state">Failed to load jobs</div>';
    count.textContent = '';
    return;
  }
  if (data.length === 0) {
    body.innerHTML = '<div class="empty-state">No jobs in queue</div>';
    count.textContent = '(0)';
    return;
  }
  count.textContent = '(' + data.length + ')';
  let html = '<table><thead><tr><th>Job ID</th><th>Status</th><th>Intent</th><th>Created</th></tr></thead><tbody>';
  data.forEach(job => {
    const status = (job.status || 'queued').toLowerCase();
    const intent = job.intent || job.name || '--';
    const created = timeAgo(job.created_at || job.created || job.createdAt);
    const id = job.id || job.job_id || '--';
    html += '<tr>';
    html += '<td class="mono">' + esc(String(id).substring(0,12)) + '</td>';
    html += '<td><span class="pill ' + status + '">' + esc(status) + '</span></td>';
    html += '<td>' + esc(String(intent).substring(0, 40)) + '</td>';
    html += '<td>' + esc(created) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  body.innerHTML = html;
}

// --- RENDER: EMAIL TRIAGE ---
function renderEmails(data) {
  const body = document.getElementById('emailBody');
  const count = document.getElementById('emailCount');
  if (!data || !Array.isArray(data)) {
    body.innerHTML = '<div class="error-state">Failed to load emails</div>';
    count.textContent = '';
    return;
  }
  if (data.length === 0) {
    body.innerHTML = '<div class="empty-state">No emails to triage</div>';
    count.textContent = '(0)';
    return;
  }
  count.textContent = '(' + data.length + ')';
  let html = '<div class="email-grid">';
  data.forEach(email => {
    const priority = (email.priority || 'medium').toLowerCase();
    const from = email.from || email.sender || '--';
    const subject = email.subject || '(no subject)';
    const bodyPreview = email.body_preview || email.body || email.preview || '';
    html += '<div class="email-card">';
    html += '<div class="email-top">';
    html += '<span class="email-from">' + esc(from) + '</span>';
    html += '<span class="priority-badge ' + priority + '">' + esc(priority) + '</span>';
    html += '</div>';
    html += '<div class="email-subject">' + esc(subject) + '</div>';
    html += '<div class="email-preview">' + esc(String(bodyPreview).substring(0, 120)) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  body.innerHTML = html;
}

// --- RENDER: DAILY TASKS ---
function renderTasks(data) {
  const body = document.getElementById('tasksBody');
  const count = document.getElementById('tasksCount');
  if (!data || !Array.isArray(data)) {
    body.innerHTML = '<div class="error-state">Failed to load tasks</div>';
    count.textContent = '';
    return;
  }
  if (data.length === 0) {
    body.innerHTML = '<div class="empty-state">No tasks for today</div>';
    count.textContent = '(0)';
    return;
  }
  count.textContent = '(' + data.length + ')';

  // Group by pillar
  const groups = {};
  data.forEach(task => {
    const pillar = (task.pillar || 'other').toLowerCase();
    if (!groups[pillar]) groups[pillar] = [];
    groups[pillar].push(task);
  });

  const order = ['cockpit_os', 'ig_content', 'gumroad', 'ppl', 'health'];
  const labels = { cockpit_os: 'COCKPIT OS', ig_content: 'IG CONTENT', gumroad: 'GUMROAD', ppl: 'PPL', health: 'HEALTH' };

  let html = '';
  order.forEach(pillar => {
    const tasks = groups[pillar];
    if (!tasks || tasks.length === 0) return;
    html += '<div class="task-group">';
    html += '<div class="task-group-title">' + (labels[pillar] || pillar.toUpperCase()) + '</div>';
    tasks.forEach(task => {
      const status = (task.status || 'active').toLowerCase();
      const label = task.label || task.title || task.name || '--';
      const due = task.due_date || task.due || task.dueDate || '';
      const checked = status === 'done' ? ' checked' : '';
      html += '<div class="task-item">';
      html += '<input type="checkbox"' + checked + ' disabled>';
      html += '<span class="task-label">' + esc(label) + '</span>';
      html += '<div class="task-meta">';
      if (status === 'done') {
        html += '<span class="pill-sm pill done">DONE</span>';
      } else if (status === 'overdue') {
        html += '<span class="pill-sm pill overdue">OVERDUE</span>';
      } else {
        html += '<span class="pill-sm pill active">ACTIVE</span>';
      }
      if (due) {
        html += '<span class="task-due">' + esc(formatDate(due)) + '</span>';
      }
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  // Any remaining pillars
  Object.keys(groups).forEach(pillar => {
    if (order.includes(pillar)) return;
    const tasks = groups[pillar];
    html += '<div class="task-group">';
    html += '<div class="task-group-title">' + esc(pillar.toUpperCase()) + '</div>';
    tasks.forEach(task => {
      const status = (task.status || 'active').toLowerCase();
      const label = task.label || task.title || task.name || '--';
      const due = task.due_date || task.due || task.dueDate || '';
      const checked = status === 'done' ? ' checked' : '';
      html += '<div class="task-item">';
      html += '<input type="checkbox"' + checked + ' disabled>';
      html += '<span class="task-label">' + esc(label) + '</span>';
      html += '<div class="task-meta">';
      if (status === 'done') {
        html += '<span class="pill-sm pill done">DONE</span>';
      } else if (status === 'overdue') {
        html += '<span class="pill-sm pill overdue">OVERDUE</span>';
      } else {
        html += '<span class="pill-sm pill active">ACTIVE</span>';
      }
      if (due) {
        html += '<span class="task-due">' + esc(formatDate(due)) + '</span>';
      }
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  body.innerHTML = html || '<div class="empty-state">No tasks</div>';
}

// --- RENDER: CONTENT CALENDAR ---
function toggleCalendarDetail(row, post) {
  const existing = row.nextElementSibling;
  if (existing && existing.classList.contains('calendar-detail')) {
    existing.remove();
    row.classList.remove('expanded');
    return;
  }
  row.classList.add('expanded');
  const detail = document.createElement('tr');
  detail.className = 'calendar-detail';
  detail.innerHTML = '<td colspan="5"><div class="detail-card">' +
    '<div class="detail-caption">' + esc(post.caption || '') + '</div>' +
    (post.song ? '<div class="detail-meta">🎵 ' + esc(post.song) + '</div>' : '') +
    (post.video_url ? '<div class="detail-meta">📹 <a href="' + esc(post.video_url) + '" target="_blank" onclick="event.stopPropagation()">Watch Video</a></div>' : '') +
    '<div class="detail-actions">' +
      '<button class="btn primary" onclick="event.stopPropagation();postNow(\'' + esc(post.id || '') + '\')">📤 Post Now</button>' +
      '<button class="btn" onclick="event.stopPropagation();copyCaption(\'' + esc(post.id || '') + '\')">📋 Copy Caption</button>' +
    '</div>' +
  '</div></td>';
  row.parentNode.insertBefore(detail, row.nextSibling);
}

function postNow(id) {
  alert('Post action for: ' + id);
}

function copyCaption(id) {
  const row = document.querySelector('[data-id="' + id + '"]');
  const post = row ? JSON.parse(row.getAttribute('data-post') || '{}') : {};
  navigator.clipboard.writeText(post.caption || '').then(function(){ alert('Caption copied!'); });
}

function renderCalendar(data) {
  const body = document.getElementById('calendarBody');
  const count = document.getElementById('calendarCount');
  if (!data || !Array.isArray(data)) {
    body.innerHTML = '<div class="error-state">Failed to load calendar</div>';
    count.textContent = '';
    return;
  }
  if (data.length === 0) {
    body.innerHTML = '<div class="empty-state">No upcoming posts</div>';
    count.textContent = '(0)';
    return;
  }
  count.textContent = '(' + data.length + ')';
  let html = '<table><thead><tr><th>Date</th><th>Platform</th><th>Caption</th><th>Status</th><th>Tags</th></tr></thead><tbody>';
  data.forEach(post => {
    const date = formatDate(post.schedule_date || post.date || post.scheduled_at);
    const platform = post.platform || '--';
    const caption = (post.caption || post.title || '').substring(0, 50);
    const status = (post.status || 'draft').toLowerCase();
    const tags = Array.isArray(post.hashtags) ? post.hashtags.join(' ') : (post.hashtags || '');
    html += '<tr onclick="toggleCalendarDetail(this, ' + JSON.stringify(post).replace(/'/g, '&#39;') + ')" data-id="' + esc(post.id || '') + '" data-post="' + esc(JSON.stringify(post)).replace(/"/g, '&quot;') + '" style="cursor:pointer">';
    html += '<td>' + esc(date) + '</td>';
    html += '<td>' + esc(platform) + '</td>';
    html += '<td>' + esc(caption) + '</td>';
    html += '<td><span class="pill ' + status + '">' + esc(status) + '</span></td>';
    html += '<td style="font-size:10px;color:var(--text-dim);">' + esc(String(tags).substring(0, 40)) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  body.innerHTML = html;
}

// --- UTILITY ---
function esc(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- IG STATUS RENDER ---
function renderIGStats(data) {
  const body = document.getElementById('igStatusBody');
  if (!data || !data.ok) {
    body.innerHTML = '<div class="ig-status-card"><div class="ig-stat-row"><div class="ig-stat-value">--</div><div class="ig-stat-label">Unavailable</div></div></div>';
    return;
  }
  const s = data.stats || data;
  const followers = s.followers || 0;
  const posts = s.posts || 0;
  const target = s.target || 50;
  const thisWeek = s.this_week || 0;
  const pct = Math.min(100, Math.round((thisWeek / target) * 100));
  const updated = s.updated_at ? new Date(s.updated_at).toLocaleDateString('en-US', {month:'short',day:'numeric'}) : '';
  body.innerHTML =
    '<div class="ig-status-card">' +
      '<div class="ig-stat-row">' +
        '<div class="ig-stat-icon"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 3a3 3 0 11-3 3 3 3 0 013-3zm0 14a7 7 0 01-7-7h2a5 5 0 005 5 5 5 0 005-5h2a7 7 0 01-7 7z"/></svg></div>' +
        '<div><div class="ig-stat-value">' + followers.toLocaleString() + '</div><div class="ig-stat-label">Followers</div></div>' +
      '</div>' +
      '<div class="ig-stat-row">' +
        '<div class="ig-stat-icon"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>' +
        '<div><div class="ig-stat-value">' + posts + '</div><div class="ig-stat-label">Posts</div></div>' +
      '</div>' +
      '<div class="ig-target-badge">' +
        '<div class="ig-compass"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><polygon points="12,2 14,10 22,12 14,14 12,22 10,14 2,12 10,10" fill="currentColor"/></svg></div>' +
        '<div><div>+' + target + '/wk Target</div>' +
          '<div class="ig-progress-bar" style="margin-top:6px;"><div class="ig-progress-fill" style="width:' + pct + '%;"></div></div>' +
          '<div style="font-size:10px;color:var(--text-dim);margin-top:3px;">' + thisWeek + ' / ' + target + ' this week' + (updated ? ' · ' + updated : '') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

// --- LOAD ALL ---
async function refreshAll() {
  const token = getToken();
  if (!token) {
    renderAllEmpty('Enter token to load data');
    updateRefreshTime();
    return;
  }

  // Show loading states
  document.getElementById('jobsBody').innerHTML = '<div class="loading">Loading jobs</div>';
  document.getElementById('emailBody').innerHTML = '<div class="loading">Loading emails</div>';
  document.getElementById('tasksBody').innerHTML = '<div class="loading">Loading tasks</div>';
  document.getElementById('calendarBody').innerHTML = '<div class="loading">Loading calendar</div>';
  document.getElementById('igStatusBody').innerHTML = '<div class="loading">Loading IG stats</div>';

  // Fetch all in parallel
  const [jobs, emails, tasks, calendar, ig] = await Promise.all([
    safeApiFetch('/api/jobs?limit=20'),
    safeApiFetch('/api/email-triage?limit=10'),
    safeApiFetch('/api/tasks'),
    safeApiFetch('/api/content-calendar'),
    safeApiFetch('/api/ig-status')
  ]);

  renderJobs(jobs?.jobs || []);
  renderEmails(emails?.emails || []);
  renderTasks(tasks?.tasks || []);
  renderCalendar(calendar?.items || []);
  renderIGStats(ig);
  updateRefreshTime();
}

function renderAllEmpty(msg) {
  const html = '<div class="empty-state">' + esc(msg) + '</div>';
  document.getElementById('jobsBody').innerHTML = html;
  document.getElementById('emailBody').innerHTML = html;
  document.getElementById('tasksBody').innerHTML = html;
  document.getElementById('calendarBody').innerHTML = html;
  document.getElementById('jobsCount').textContent = '';
  document.getElementById('emailCount').textContent = '';
  document.getElementById('tasksCount').textContent = '';
  document.getElementById('calendarCount').textContent = '';
}

function updateRefreshTime() {
  const now = new Date();
  document.getElementById('lastRefresh').textContent =
    now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// --- COUNTDOWN ---
function startCountdown() {
  let remaining = 60;
  const el = document.getElementById('countdown');
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0) remaining = 60;
    el.textContent = remaining + 's';
  }, 1000);
}

// --- INIT ---
function init() {
  // Pre-populate token input if saved
  const saved = getToken();
  if (saved) {
    document.getElementById('tokenInput').placeholder = 'Token saved (hidden)';
  }

  // Initial load
  refreshAll();

  // Auto-refresh every 60s
  if (refreshInterval) clearInterval(refreshInterval);
  refreshInterval = setInterval(refreshAll, 60000);

  // Countdown
  startCountdown();
}

// On Enter in token input
document.getElementById('tokenInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveToken();
});

// Start
init();
</script>
